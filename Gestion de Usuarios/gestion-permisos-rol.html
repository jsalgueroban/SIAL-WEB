<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIAL | Administracion de permisos en roles</title>
  <script>
    (function () {
      const savedTheme = localStorage.getItem("sial-theme");
      const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = savedTheme || (systemDark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="sial-usuarios.css" />
</head>
<body data-view-family="configuracion">
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegacion principal">
      <div class="brand"><span class="brand-badge">S</span><span>SIAL</span></div>
      <p class="menu-caption">Usuarios</p>
      <nav data-nav></nav>
    </aside>
    <header class="header">
      <div class="header-left">
        <button class="icon-btn" aria-label="Abrir menu">
          <svg class="icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <label class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input aria-label="Busqueda principal" placeholder="Buscar..." /></label>
      </div>
      <div class="header-right">
        <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-label="Cambiar a modo oscuro" aria-pressed="false" title="Cambiar a modo oscuro">
          <svg class="icon theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path></svg>
          <svg class="icon theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
        </button>
        <button class="icon-btn" aria-label="Notificaciones">
          <svg class="icon" viewBox="0 0 24 24"><path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5"></path><path d="M10 17a2 2 0 0 0 4 0"></path></svg>
        </button>
        <span class="avatar">QA</span>
      </div>
    </header>
    <main class="main">
      <section class="page permission-page">
        <p class="page-eyebrow">Usuarios / Seguridad / Permisos</p>
        <div class="page-header">
          <div>
            <h1 class="page-title">Administracion de permisos en roles</h1>
            <p class="page-subtitle">Selecciona un rol y ajusta rapidamente que acciones puede ejecutar en cada modulo.</p>
          </div>
        </div>

        <section class="permission-admin-panel" aria-label="Administracion de permisos por rol">
          <div class="permission-toolbar">
            <div class="permission-field">
              <select class="select" id="permissionRoleSelect" aria-label="Seleccionar rol"></select>
            </div>
            <div class="permission-field">
              <input class="input" id="permissionSearch" type="search" data-sial-search-adapter aria-label="Buscar permiso o módulo" placeholder="Permiso o módulo" />
            </div>
            <div class="permission-field">
              <select class="select" id="permissionModuleFilter" aria-label="Filtrar permisos por modulo">
                <option value="all">Todos los modulos</option>
              </select>
            </div>
            <div class="permission-actions">
              <span class="chip" id="permissionStateChip">Sin cambios</span>
              <button class="btn btn-secondary" type="button" id="resetPermissions" disabled>Restablecer</button>
              <button class="btn btn-primary" type="button" id="savePerms" disabled>Guardar</button>
            </div>
          </div>

          <div class="permission-role-context">
            <div>
              <span class="section-kicker">Rol seleccionado</span>
              <strong id="selectedPermissionRole">-</strong>
              <small id="selectedPermissionMeta">-</small>
            </div>
            <a class="btn btn-secondary" id="viewRoleAssignments" href="roles-asignaciones.html">Ver asignaciones</a>
          </div>

          <p class="field-note" id="permissionPersistenceStatus" role="status" aria-live="polite"></p>

          <div class="permission-matrix-list" id="permissionMatrix"></div>
          <div class="empty-state is-hidden" id="permissionEmpty">No hay permisos que coincidan con los filtros.</div>
        </section>
      </section>
    </main>
  </div>
  <script src="../shared/sial-core.js"></script>
  <script src="sial-usuarios.js"></script>
  <script>SIAL.applyShell("permisosRol"); SIAL.initPermissionGrid();</script>
</body>
</html>
